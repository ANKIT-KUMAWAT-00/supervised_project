version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: librava-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-librava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-librava_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-librava}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-librava}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: librava-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-librava}:${POSTGRES_PASSWORD:-librava_secure_2026}@db:5432/${POSTGRES_DB:-librava}
      - SECRET_KEY=${SECRET_KEY:-libra-quantum-cryptographic-key-hyper-secure-2026}
      - SIMULATE_IOT_PULSE=true
      - SIMULATION_INTERVAL_SECONDS=5
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/ml/saved_models:/app/app/ml/saved_models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: librava-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
